# Tells Bing (and Copilot, Yandex, Seznam, Naver) about changed pages as soon as they reach main, via IndexNow.
# The key file 84a2adb432ab19f383d30400c26c916e.txt at the site root proves the site is ours. Google does not use IndexNow; for Google,
# the sitemap and Search Console's "Request indexing" do this job.
name: IndexNow
on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for the Vercel deploy
        run: sleep 90
      - name: Send changed pages to IndexNow
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request
          KEY = "84a2adb432ab19f383d30400c26c916e"
          HOST = "www.veshannastro.co.in"
          status = subprocess.run(["git", "diff", "--name-status", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.splitlines()
          sitemap = open("sitemap.xml", encoding="utf-8").read()
          urls = []
          for line in status:
              parts = line.split("\t")
              kind, f = parts[0][:1], parts[-1]
              if not f.endswith(".html"):
                  continue
              u = "https://" + HOST + "/" + (f[:-10] if f.endswith("index.html") else f)
              # Changed pages that are in the sitemap, and deleted pages (they now redirect, so the engine re-crawls and drops them).
              if kind == "D" or "<loc>" + u + "</loc>" in sitemap:
                  urls.append(u)
          if not urls:
              print("No sitemap pages changed or deleted.")
              raise SystemExit(0)
          body = json.dumps({"host": HOST, "key": KEY, "keyLocation": "https://" + HOST + "/" + KEY + ".txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow", r.status, "for", len(urls), "pages")
          PY

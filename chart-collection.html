<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Studies — Veshann Astro</title>
<meta name="description" content="Real charts, real questions, and the remedies given. A working record from the consulting desk at Veshann Astro.">
<link rel="canonical" href="https://www.veshannastro.co.in/chart-collection.html">
<meta property="og:title" content="Case Studies — Veshann Astro">
<meta property="og:description" content="Real charts, real questions, and the remedies given.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --c-white:#FCFBF8;
  --c-beige:#F2EADB;
  --beige-soft:#F7F2E8;
  --beige-deep:#E8DECB;
  --c-grey:#E5E2DB;
  --c-mute:#8A8178;
  --c-body:#5C534E;
  --c-ink:#23201D;
  --display:"Cinzel",Georgia,serif;
  --ui:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ui);font-weight:300;font-size:16px;line-height:1.7;color:var(--c-body);background:var(--c-white);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img{display:block;max-width:100%}
::selection{background:var(--beige-deep)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
@media(max-width:640px){.wrap{padding:0 18px}}

/* ------------------------------------------------------------------ intro */
.hero{padding:92px 0 54px;text-align:center;border-bottom:1px solid var(--c-grey)}
.eyebrow{font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--c-mute);margin-bottom:22px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5.2vw,46px);line-height:1.18;color:var(--c-ink);letter-spacing:.01em}
.hero p{max-width:560px;margin:20px auto 0;color:var(--c-mute);font-size:16.5px}
.rule{width:46px;height:1px;background:var(--beige-deep);margin:28px auto 0}
@media(max-width:640px){.hero{padding:60px 0 40px}}

/* ---------------------------------------------------------------- filters */
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:26px 0;border-bottom:1px solid var(--c-grey)}
.chip{height:31px;padding:0 15px;border-radius:100px;border:1px solid var(--c-grey);font-size:12px;letter-spacing:.06em;color:var(--c-mute);transition:all .22s var(--ease)}
.chip:hover{border-color:var(--c-mute);color:var(--c-ink)}
.chip.on{background:var(--c-ink);border-color:var(--c-ink);color:var(--c-white)}
.n{margin-left:auto;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-mute)}

/* ------------------------------------------------------------------- grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:34px;padding:44px 0 100px}
@media(max-width:640px){.grid{grid-template-columns:1fr;gap:26px;padding:30px 0 70px}}

.case{text-align:left;display:flex;flex-direction:column;transition:transform .4s var(--ease)}
.case:hover{transform:translateY(-4px)}
.case .shot{
  aspect-ratio:1;background:var(--beige-soft);border:1px solid var(--c-grey);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.case .shot img{width:100%;height:100%;object-fit:cover}
.case:hover .shot{border-color:var(--beige-deep)}
.case .glyph{font-family:var(--display);font-size:30px;color:var(--beige-deep)}
.case h3{font-family:var(--display);font-weight:500;font-size:17px;color:var(--c-ink);margin-top:16px;line-height:1.35}
.case .kind{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-mute);margin-top:6px}
.case .q{font-size:14.5px;color:var(--c-body);margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.case .more{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-ink);margin-top:13px;display:inline-flex;align-items:center;gap:7px}
.case .more::after{content:"";width:15px;height:1px;background:var(--c-ink);transition:width .3s var(--ease)}
.case:hover .more::after{width:26px}

/* ------------------------------------------------------------------ modal */
.veil{position:fixed;inset:0;z-index:80;background:rgba(20,18,16,.4);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.veil.open{opacity:1;pointer-events:auto}
.modal{
  position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(660px,100vw);
  background:var(--c-white);border-left:1px solid var(--c-grey);
  display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s var(--ease);
}
.modal.open{transform:none}
.m-head{display:flex;align-items:center;padding:20px 30px;border-bottom:1px solid var(--c-grey)}
.m-head span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--c-mute)}
.m-head button{margin-left:auto;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-mute)}
.m-head button:hover{color:var(--c-ink)}
.m-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.m-shots{display:flex;gap:10px;padding:22px 30px;background:var(--beige-soft);border-bottom:1px solid var(--c-grey);overflow-x:auto}
.m-shots img{height:210px;border:1px solid var(--c-grey);background:var(--c-white);cursor:zoom-in;flex:0 0 auto}
.m-in{padding:30px}
@media(max-width:640px){.m-head,.m-in,.m-shots{padding-left:18px;padding-right:18px}}
.m-name{font-family:var(--display);font-weight:500;font-size:27px;color:var(--c-ink);line-height:1.25}
.m-kind{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--c-mute);margin-top:9px}
.facts{display:flex;flex-wrap:wrap;gap:0 30px;margin-top:22px;padding-top:6px;border-top:1px solid var(--c-grey)}
.fact{padding:12px 0;min-width:118px}
.fact dt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-mute)}
.fact dd{font-size:14.5px;color:var(--c-ink);margin-top:3px}
.note{margin-top:28px}
.note h4{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-ink);margin-bottom:9px}
.note p{white-space:pre-wrap;font-size:15.5px;line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px}
.tag{height:25px;padding:0 12px;border-radius:100px;background:var(--c-beige);font-size:11.5px;color:var(--c-body);display:flex;align-items:center}
.disclaim{margin-top:34px;padding-top:20px;border-top:1px solid var(--c-grey);font-size:12.5px;color:var(--c-mute);line-height:1.65}

.lb{position:fixed;inset:0;z-index:120;background:rgba(20,18,16,.94);display:none;align-items:center;justify-content:center;padding:34px;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}

.state{padding:110px 0;text-align:center}
.state h2{font-family:var(--display);font-weight:400;font-size:23px;color:var(--c-ink);margin-bottom:8px}
.state p{color:var(--c-mute)}
.skel{background:linear-gradient(90deg,#EFEDE8 25%,var(--beige-soft) 50%,#EFEDE8 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px;margin-top:10px}

footer.foot{border-top:1px solid var(--c-grey);padding:40px 0;text-align:center}
.foot a{font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--c-ink);text-decoration:none;border-bottom:1px solid var(--beige-deep);padding-bottom:3px}
.foot a:hover{border-color:var(--c-ink)}
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow">Veshann Astro</p>
    <h1>Case Studies</h1>
    <p>Charts that came across the desk, the question each person carried, and the remedy that was given. Names and birth details are withheld.</p>
    <div class="rule"></div>
  </div>
</section>

<main class="wrap">
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="wrap"><a href="/">Back to Veshann Astro</a></div>
</footer>

<div class="veil" id="veil"></div>
<aside class="modal" id="modal" aria-hidden="true">
  <div class="m-head"><span>Case study</span><button id="close">Close</button></div>
  <div class="m-body" id="mBody"></div>
</aside>
<div class="lb" id="lb"><img alt=""></div>

<script>
(function () {
'use strict';

/* ─────────────────────────────────────────────────────────────── CONFIGURE
   Paste the same Apps Script web app URL you used in the admin app.
   No token here — this page can only ever read published cases.        */
const API = 'https://script.google.com/macros/s/AKfycbwyX6q6y6Pbt4-ALEc1uxQDXnea1i8nM_X1NNu_hig7KAp34SXVHJVV4NMsVQwBRhK4Yg/exec';
/* ──────────────────────────────────────────────────────────────────────── */

const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cases = [], filter = 'all', current = null;

function skeleton() {
  $('#grid').innerHTML = Array.from({ length: 6 }, () =>
    `<div class="case"><div class="shot skel"></div><div class="sk-line skel" style="width:65%"></div><div class="sk-line skel" style="width:40%"></div></div>`).join('');
}

function tagsOf(r) {
  return String(r.tags || '').split(',').map(t => t.trim()).filter(Boolean);
}

function shown() {
  if (filter === 'all') return cases;
  return cases.filter(r => tagsOf(r).some(t => t.toLowerCase() === filter) || r.chart_type === filter);
}

function renderBar() {
  const tags = Array.from(new Set(cases.flatMap(t => tagsOf(t).map(x => x.toLowerCase())))).sort();
  const defs = [['all', 'All cases']].concat(tags.map(t => [t, t]));
  $('#bar').innerHTML = defs.map(([k, l]) =>
    `<button class="chip${filter === k ? ' on' : ''}" data-f="${esc(k)}">${esc(l.charAt(0).toUpperCase() + l.slice(1))}</button>`).join('') +
    `<span class="n">${shown().length} case${shown().length === 1 ? '' : 's'}</span>`;
}

function renderGrid() {
  const list = shown();
  if (!list.length) {
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1"><h2>No cases here yet</h2><p>New case studies are added as consultations close.</p></div>`;
    return;
  }
  $('#grid').innerHTML = list.map(r => {
    const ph = (r.photos && r.photos[0]) || null;
    const kind = [r.chart_type, r.rashi].filter(Boolean).join(' · ');
    return `<button class="case" data-id="${esc(r.id)}">
      <div class="shot">${ph
        ? `<img src="${esc(ph.url)}" alt="Chart" loading="lazy" onerror="this.style.display='none'">`
        : `<span class="glyph">✧</span>`}</div>
      <h3>${esc(r.public_name || 'Anonymous')}</h3>
      ${kind ? `<div class="kind">${esc(kind)}</div>` : ''}
      ${r.problem ? `<p class="q">${esc(r.problem)}</p>` : ''}
      <span class="more">Read the case</span>
    </button>`;
  }).join('');
}

function open(r) {
  current = r;
  const facts = [['Chart', r.chart_type], ['Lagna', r.lagna], ['Rashi', r.rashi], ['Nakshatra', r.nakshatra], ['Gender', r.gender]]
    .filter(([, v]) => v);
  const notes = [['The question', r.problem], ['The reading', r.analysis], ['The remedy', r.remedy], ['What followed', r.outcome]]
    .filter(([, v]) => v);
  const tags = tagsOf(r);

  $('#mBody').innerHTML = `
    ${r.photos && r.photos.length ? `<div class="m-shots">${r.photos.map(p =>
      `<img src="${esc(p.url)}" alt="${esc(p.name || 'Chart')}" data-full="${esc(p.url)}">`).join('')}</div>` : ''}
    <div class="m-in">
      <div class="m-name">${esc(r.public_name || 'Anonymous')}</div>
      ${r.chart_type ? `<div class="m-kind">${esc(r.chart_type)}</div>` : ''}
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) =>
        `<div class="fact"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${notes.map(([k, v]) => `<div class="note"><h4>${esc(k)}</h4><p>${esc(v)}</p></div>`).join('')}
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
      <p class="disclaim">Shared with permission. Names, birth dates, birth times and places are withheld. Every chart is read on its own terms — a remedy that suited this person may not suit yours.</p>
    </div>`;

  $('#veil').classList.add('open');
  $('#modal').classList.add('open');
  $('#modal').setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function close() {
  $('#veil').classList.remove('open');
  $('#modal').classList.remove('open');
  $('#modal').setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

async function load() {
  skeleton();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API)) {
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1"><h2>Not configured</h2><p>Paste your Apps Script web app URL into the <code>API</code> constant near the bottom of this file.</p></div>`;
    $('#bar').innerHTML = '';
    return;
  }
  try {
    const r = await fetch(API + '?t=' + Date.now(), { redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Could not load');
    cases = (j.records || []).filter(x => x.photos || x.problem);
    renderBar(); renderGrid();
  } catch (e) {
    $('#bar').innerHTML = '';
    $('#grid').innerHTML = `<div class="state" style="grid-column:1/-1"><h2>Cases are taking a moment</h2><p>Please refresh in a few seconds.</p></div>`;
  }
}

$('#bar').addEventListener('click', e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  filter = b.dataset.f;
  renderBar(); renderGrid();
});
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('[data-id]');
  if (!c) return;
  const r = cases.find(x => x.id === c.dataset.id);
  if (r) open(r);
});
$('#mBody').addEventListener('click', e => {
  const i = e.target.closest('[data-full]');
  if (!i) return;
  $('#lb img').src = i.dataset.full;
  $('#lb').classList.add('open');
});
$('#lb').onclick = () => $('#lb').classList.remove('open');
$('#close').onclick = close;
$('#veil').onclick = close;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  $('#lb').classList.contains('open') ? $('#lb').classList.remove('open') : close();
});

load();
})();
</script>
</body>
</html>

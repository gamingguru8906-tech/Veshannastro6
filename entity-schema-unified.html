================================================================================
VESHANNASTRO — UNIFIED ENTITY SCHEMA  (drop-in replacement)
================================================================================

WHY THIS EXISTS
---------------
index.html currently ships FIVE separate JSON-LD blocks that define the business
TWICE, under two different @id values:

  Block 0 : {"@type":"LocalBusiness", "@id":"https://www.veshannastro.co.in"}
  Block 3 : {"@type":"Organization",  "@id":"https://www.veshannastro.co.in/#organization"}

Google resolves @id values literally. Two @ids = two candidate entities, each
holding half the evidence. Neither accumulates enough signal to earn a Knowledge
Panel — which is why a search for "Veshannastro" currently returns unrelated
results instead of this site.

They also contradict each other:
  - LocalBusiness openingHours  : 00:00–23:59
  - Organization contactPoint   : 10:00–20:00
Contradictory facts about the same business reduce confidence further.

And sameAs contains exactly ONE profile. sameAs is the primary mechanism by
which Google links a website to a real-world entity. One node is not a graph.

WHAT THIS FILE DOES
-------------------
Collapses everything into ONE entity node, typed as both Organization and
LocalBusiness, under a single canonical @id (#organization). Every other node
— Person, Service, WebSite, WebPage — references that one @id.

Adds: full sameAs array, alternateName (misspelling capture), founder Person
with credentials, Book nodes for both published titles, knowsLanguage,
areaServed, and a hasOfferCatalog covering the new consultation tiers.

================================================================================
HOW TO INSTALL
================================================================================

STEP 1  In index.html, DELETE these two existing JSON-LD script blocks entirely:
          - the standalone {"@type":"LocalBusiness"} block (currently block 0)
          - the @graph block containing {"@type":"Organization", ...} (block 3)

STEP 2  Paste the <script> block below into <head> in their place.

STEP 3  Leave your existing FAQPage and BreadcrumbList blocks alone —
        they are correct and do not conflict.

STEP 4  IMPORTANT — see the AggregateRating / Review warning at the bottom
        of this file before deploying.

STEP 5  Every URL in "sameAs" must be a LIVE, CLAIMED profile that links back
        to veshannastro.co.in. A sameAs pointing at a profile that does not
        exist is worse than no sameAs at all — it is an unverifiable claim.

================================================================================
-->

================================================================================
⚠️  ACTION REQUIRED BEFORE DEPLOY — AggregateRating / Review
================================================================================

index.html currently marks up three client testimonials as Review nodes with
Rating values, attached to your own Service nodes. Elsewhere on the site there
are three AggregateRating nodes.

Google's structured data policy is explicit: self-serving reviews are NOT
permitted for LocalBusiness or Organization. A review you host, about yourself,
that you also mark up as a rating, is by definition self-serving.

Best case  : the markup is ignored and earns nothing.
Worst case : a manual action for spammy structured data, which suppresses ALL
             your rich results — including the FAQ and Product markup that is
             currently working correctly.

RECOMMENDED
  1. Remove every "aggregateRating" node that rates your own business/services.
  2. Remove "reviewRating" from self-hosted testimonials. You may keep the
     testimonials as visible page content — they convert well and are entirely
     legitimate as copy. Just do not mark them up with star ratings.
  3. Collect real reviews on Google Business Profile instead. Those DO surface
     as stars, they are third-party verified, and they simultaneously build the
     brand entity this file is designed to establish.

The testimonials stay on the page. Only the rating markup comes off.
================================================================================
